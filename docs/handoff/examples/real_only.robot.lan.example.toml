# Historical deployed robot config; verify on robot before use.
[robot]
hardware = "R1_PRO"
embodiment_type = "galaxea_r1pro"
initial_joints_path = "scripts/initial_joints.json"

[basic]
use_ehi = false
control_frequency = 20.0
step_mode = "sync" # Optional["sync", "async"]
action_steps = 5

[websocket]
host = "10.42.0.191"
port = 8096

[instruction]
use_vlm = false
bbox_as_instruction = false
image_condition_lang_prefix = false
pp_lower_half = false
image_as_condition = false

# Provisional command-space caps, not manufacturer-certified hardware limits.
[joint_command_filter]
enabled = true
max_step_rad = 0.1
max_velocity = 1.5
max_tracking_error = 0.25
max_observation_age_seconds = 0.5

[joint_command_filter.left_gripper]
range = [0.0, 80.0]

[joint_command_filter.right_gripper]
range = [0.0, 80.0]
